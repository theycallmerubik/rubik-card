<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- SUIT ICONS -->
    <g id="root-fox-suit" viewBox="0 0 32 32">
      <path d="M16 4 L6 14 L9 26 L16 29 L23 26 L26 14 Z" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
      <polygon points="6,14 10,6 12,12" fill="#d35400"/>
      <polygon points="26,14 22,6 20,12" fill="#d35400"/>
      <!-- Fox Face white patches & eyes -->
      <polygon points="16,18 10,24 16,28 22,24" fill="#fdfefe"/>
      <circle cx="12" cy="17" r="1.6" fill="#1b2631"/>
      <circle cx="20" cy="17" r="1.6" fill="#1b2631"/>
      <circle cx="16" cy="24" r="1.4" fill="#1b2631"/>
    </g>

    <g id="root-rabbit-suit" viewBox="0 0 32 32">
      <!-- Rabbit long ears -->
      <ellipse cx="12" cy="10" rx="3.5" ry="8" fill="#f39c12" stroke="#d68910" stroke-width="1.2"/>
      <ellipse cx="20" cy="10" rx="3.5" ry="8" fill="#f39c12" stroke="#d68910" stroke-width="1.2"/>
      <ellipse cx="12" cy="10" rx="1.6" ry="5.5" fill="#fadbd8"/>
      <ellipse cx="20" cy="10" rx="1.6" ry="5.5" fill="#fadbd8"/>
      <!-- Rabbit Face -->
      <circle cx="16" cy="20" r="8" fill="#f5b041" stroke="#d68910" stroke-width="1.2"/>
      <circle cx="13" cy="19" r="1.4" fill="#1b2631"/>
      <circle cx="19" cy="19" r="1.4" fill="#1b2631"/>
      <polygon points="16,22 14.5,23.5 17.5,23.5" fill="#e74c3c"/>
      <path d="M14.5 24 Q16 26 17.5 24" stroke="#1b2631" stroke-width="1" fill="none"/>
    </g>

    <g id="root-mouse-suit" viewBox="0 0 32 32">
      <!-- Mouse large round ears -->
      <circle cx="9" cy="11" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2"/>
      <circle cx="23" cy="11" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2"/>
      <circle cx="9" cy="11" r="3.2" fill="#f9ebea"/>
      <circle cx="23" cy="11" r="3.2" fill="#f9ebea"/>
      <!-- Mouse Head -->
      <circle cx="16" cy="20" r="7.5" fill="#ec7063" stroke="#c0392b" stroke-width="1.2"/>
      <circle cx="13" cy="19" r="1.4" fill="#1b2631"/>
      <circle cx="19" cy="19" r="1.4" fill="#1b2631"/>
      <circle cx="16" cy="23" r="1.5" fill="#1b2631"/>
      <!-- Whiskers -->
      <line x1="8" y1="21" x2="13" y2="22" stroke="#1b2631" stroke-width="0.8"/>
      <line x1="8" y1="23" x2="13" y2="23" stroke="#1b2631" stroke-width="0.8"/>
      <line x1="24" y1="21" x2="19" y2="22" stroke="#1b2631" stroke-width="0.8"/>
      <line x1="24" y1="23" x2="19" y2="23" stroke="#1b2631" stroke-width="0.8"/>
    </g>

    <g id="root-bird-suit" viewBox="0 0 32 32">
      <!-- Wild Bird Emblem (Eyrie Royal Crest) -->
      <path d="M16 3 L22 11 L29 11 L23 18 L25 28 L16 22 L7 28 L9 18 L3 11 L10 11 Z" fill="#2980b9" stroke="#1b4f72" stroke-width="1.5"/>
      <circle cx="16" cy="14" r="5" fill="#3498db"/>
      <polygon points="16,13 14,17 18,17" fill="#f1c40f"/>
      <circle cx="14" cy="12" r="1" fill="#1b2631"/>
      <circle cx="18" cy="12" r="1" fill="#1b2631"/>
    </g>

    <!-- FACTION WARRIORS -->
    <g id="warrior-marquise" viewBox="0 0 40 50">
      <!-- Marquise Orange Cat Warrior with armor and halberd -->
      <ellipse cx="20" cy="42" rx="12" ry="6" fill="#1b2631" opacity="0.25"/>
      <!-- Body & Cape -->
      <path d="M10 44 L14 26 L26 26 L30 44 Z" fill="#d35400"/>
      <path d="M14 26 L20 36 L26 26 Z" fill="#f39c12"/>
      <!-- Cat Head with pointed ears -->
      <polygon points="12,18 10,6 16,12" fill="#e67e22" stroke="#b9530e" stroke-width="1"/>
      <polygon points="28,18 30,6 24,12" fill="#e67e22" stroke="#b9530e" stroke-width="1"/>
      <circle cx="20" cy="18" r="9" fill="#e67e22" stroke="#b9530e" stroke-width="1.2"/>
      <!-- Eyes & whiskers -->
      <ellipse cx="16.5" cy="16.5" rx="1.6" ry="1.2" fill="#27ae60"/>
      <ellipse cx="23.5" cy="16.5" rx="1.6" ry="1.2" fill="#27ae60"/>
      <circle cx="16.5" cy="16.5" r="0.7" fill="#000"/>
      <circle cx="23.5" cy="16.5" r="0.7" fill="#000"/>
      <polygon points="20,19 18.5,21 21.5,21" fill="#c0392b"/>
      <!-- Small royal collar -->
      <rect x="15" y="24" width="10" height="3" rx="1.5" fill="#f1c40f"/>
    </g>

    <g id="warrior-eyrie" viewBox="0 0 40 50">
      <!-- Eyrie Blue Bird Warrior with helmet and spear -->
      <ellipse cx="20" cy="42" rx="12" ry="6" fill="#1b2631" opacity="0.25"/>
      <!-- Blue Tunic & Feathered Wings -->
      <path d="M9 44 C8 32 12 26 20 26 C28 26 32 32 31 44 Z" fill="#1f618d"/>
      <!-- Spear -->
      <line x1="33" y1="6" x2="33" y2="46" stroke="#7f8c8d" stroke-width="1.8"/>
      <polygon points="33,2 30,8 36,8" fill="#bdc3c7"/>
      <!-- Bird Head -->
      <circle cx="20" cy="16" r="8" fill="#2980b9" stroke="#154360" stroke-width="1.2"/>
      <!-- Eyrie Helmet Crest -->
      <path d="M16 10 C16 4 24 4 24 10 Z" fill="#f1c40f"/>
      <polygon points="20,16 26,17 20,20" fill="#f39c12"/>
      <circle cx="17" cy="14" r="1.3" fill="#ffffff"/>
      <circle cx="17" cy="14" r="0.7" fill="#000000"/>
    </g>

    <g id="warrior-alliance" viewBox="0 0 40 50">
      <!-- Woodland Alliance Green Insurgent with hood and dagger -->
      <ellipse cx="20" cy="42" rx="12" ry="6" fill="#1b2631" opacity="0.25"/>
      <!-- Green Forester Cloak -->
      <path d="M11 44 C10 32 13 25 20 25 C27 25 30 32 29 44 Z" fill="#1e8449"/>
      <!-- Alliance Hood -->
      <path d="M12 22 C10 10 30 10 28 22 C26 25 14 25 12 22 Z" fill="#27ae60"/>
      <!-- Mouse snout inside hood -->
      <circle cx="20" cy="18" r="4.5" fill="#f5b7b1"/>
      <circle cx="18" cy="16.5" r="1.1" fill="#1b2631"/>
      <circle cx="22" cy="16.5" r="1.1" fill="#1b2631"/>
      <circle cx="20" cy="19.5" r="1.2" fill="#c0392b"/>
      <!-- Dagger -->
      <line x1="9" y1="28" x2="9" y2="42" stroke="#95a5a6" stroke-width="1.5"/>
      <rect x="7" y="32" width="4" height="1.5" fill="#f1c40f"/>
    </g>

    <!-- VAGABOND PAWN -->
    <g id="pawn-vagabond" viewBox="0 0 40 50">
      <!-- Vagabond Raccoon Adventurer with cloak, hat, and torch -->
      <ellipse cx="20" cy="44" rx="13" ry="5.5" fill="#1b2631" opacity="0.3"/>
      <!-- Brown Traveler Cape -->
      <path d="M10 44 C9 30 12 24 20 24 C28 24 31 30 30 44 Z" fill="#6c3483"/>
      <!-- Satchel strap -->
      <line x1="12" y1="25" x2="28" y2="43" stroke="#af601a" stroke-width="2.5"/>
      <rect x="23" y="36" width="8" height="6" rx="2" fill="#784212"/>
      <!-- Raccoon Mask & Head -->
      <circle cx="20" cy="16" r="8.5" fill="#95a5a6" stroke="#5d6d7e" stroke-width="1.2"/>
      <!-- Black bandit eye mask -->
      <path d="M13 14 C15 12 25 12 27 14 C27 18 13 18 13 14 Z" fill="#2c3e50"/>
      <circle cx="16.5" cy="15" r="1.2" fill="#fdfefe"/>
      <circle cx="23.5" cy="15" r="1.2" fill="#fdfefe"/>
      <polygon points="20,18 18.5,20.5 21.5,20.5" fill="#1b2631"/>
      <!-- Traveler Feathered Cap -->
      <path d="M12 12 C14 4 26 4 28 12 Z" fill="#8e44ad"/>
      <path d="M26 6 Q32 0 34 8" stroke="#f1c40f" stroke-width="2" fill="none"/>
    </g>

    <!-- BUILDINGS & TOKENS -->
    <g id="building-sawmill" viewBox="0 0 36 36">
      <rect x="4" y="10" width="28" height="22" rx="3" fill="#d35400" stroke="#a04000" stroke-width="1.5"/>
      <!-- Roof -->
      <polygon points="18,2 2,12 34,12" fill="#ba4a00"/>
      <!-- Circular Saw Blade -->
      <circle cx="18" cy="22" r="7" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1.2"/>
      <circle cx="18" cy="22" r="2.5" fill="#34495e"/>
      <line x1="18" y1="13" x2="18" y2="31" stroke="#7f8c8d" stroke-width="1.2"/>
      <line x1="9" y1="22" x2="27" y2="22" stroke="#7f8c8d" stroke-width="1.2"/>
    </g>

    <g id="building-workshop" viewBox="0 0 36 36">
      <rect x="5" y="12" width="26" height="20" rx="2" fill="#e67e22" stroke="#a04000" stroke-width="1.5"/>
      <polygon points="18,3 3,14 33,14" fill="#a04000"/>
      <!-- Anvil & Chimney -->
      <rect x="23" y="4" width="4" height="8" fill="#7f8c8d"/>
      <path d="M12 24 L24 24 L22 28 L14 28 Z" fill="#2c3e50"/>
      <rect x="14" y="21" width="8" height="3" fill="#34495e"/>
    </g>

    <g id="building-recruiter" viewBox="0 0 36 36">
      <rect x="5" y="12" width="26" height="20" rx="3" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/>
      <!-- Tent spikes & Banner -->
      <polygon points="18,4 4,14 32,14" fill="#d68910"/>
      <!-- Crossed swords emblem -->
      <line x1="12" y1="18" x2="24" y2="28" stroke="#1b2631" stroke-width="2"/>
      <line x1="24" y1="18" x2="12" y2="28" stroke="#1b2631" stroke-width="2"/>
      <circle cx="18" cy="23" r="2" fill="#f1c40f"/>
    </g>

    <g id="building-roost" viewBox="0 0 36 36">
      <!-- Eyrie Roost (Castle Eyrie Turret) -->
      <rect x="7" y="10" width="22" height="22" fill="#2471a3" stroke="#1a5276" stroke-width="1.5"/>
      <!-- Battlements -->
      <polygon points="5,10 5,6 10,6 10,10 15,10 15,6 21,6 21,10 26,10 26,6 31,6 31,10" fill="#1b4f72"/>
      <!-- Arch Gate -->
      <path d="M14 32 L14 22 C14 18 22 18 22 22 L22 32 Z" fill="#154360"/>
      <circle cx="18" cy="14" r="2" fill="#f1c40f"/>
    </g>

    <g id="building-base-fox" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16" fill="#27ae60" stroke="#196f3d" stroke-width="1.8"/>
      <circle cx="18" cy="18" r="12" fill="#2ecc71"/>
      <g transform="translate(6, 6) scale(0.62)">
        <use href="#root-fox-suit"/>
      </g>
    </g>

    <g id="building-base-rabbit" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16" fill="#27ae60" stroke="#196f3d" stroke-width="1.8"/>
      <circle cx="18" cy="18" r="12" fill="#2ecc71"/>
      <g transform="translate(6, 6) scale(0.62)">
        <use href="#root-rabbit-suit"/>
      </g>
    </g>

    <g id="building-base-mouse" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16" fill="#27ae60" stroke="#196f3d" stroke-width="1.8"/>
      <circle cx="18" cy="18" r="12" fill="#2ecc71"/>
      <g transform="translate(6, 6) scale(0.62)">
        <use href="#root-mouse-suit"/>
      </g>
    </g>

    <g id="token-keep" viewBox="0 0 36 36">
      <!-- Marquise Keep Token -->
      <circle cx="18" cy="18" r="16" fill="#e67e22" stroke="#935116" stroke-width="2"/>
      <rect x="10" y="10" width="16" height="16" fill="#f39c12"/>
      <polygon points="8,10 18,2 28,10" fill="#ba4a00"/>
      <text x="18" y="24" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">🏰</text>
    </g>

    <g id="token-wood" viewBox="0 0 32 32">
      <!-- Cut Wood Log Token -->
      <rect x="4" y="8" width="20" height="16" rx="3" fill="#873600" stroke="#5b2c6f" stroke-width="1"/>
      <!-- Wood grain rings -->
      <ellipse cx="24" cy="16" rx="5" ry="8" fill="#d35400" stroke="#5b2c6f" stroke-width="1.2"/>
      <ellipse cx="24" cy="16" rx="2.5" ry="4.5" fill="#e59866"/>
      <circle cx="24" cy="16" r="1" fill="#873600"/>
    </g>

    <g id="token-sympathy" viewBox="0 0 32 32">
      <!-- Woodland Alliance Sympathy Token -->
      <circle cx="16" cy="16" r="14" fill="#2ecc71" stroke="#145a32" stroke-width="2"/>
      <circle cx="16" cy="16" r="10" fill="#a9dfbf"/>
      <path d="M16 8 Q20 12 24 16 Q20 20 16 24 Q12 20 8 16 Q12 12 16 8 Z" fill="#1e8449"/>
      <circle cx="16" cy="16" r="2.5" fill="#fdfefe"/>
    </g>

    <g id="ruin-marker" viewBox="0 0 36 36">
      <!-- Ancient Stone Ruin Marker -->
      <rect x="4" y="4" width="28" height="28" rx="4" fill="#7f8c8d" stroke="#34495e" stroke-width="1.8"/>
      <polygon points="8,8 14,8 12,28 6,28" fill="#566573"/>
      <polygon points="22,8 28,8 30,28 24,28" fill="#566573"/>
      <rect x="6" y="6" width="24" height="6" fill="#95a5a6"/>
      <text x="18" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#f1c40f">🏛️</text>
    </g>

    <!-- ITEMS -->
    <g id="item-boot" viewBox="0 0 32 32">
      <path d="M10 4 L18 4 L18 18 L26 21 C28 22 28 26 25 26 L8 26 C6 26 6 22 8 20 L10 18 Z" fill="#af601a" stroke="#6e2c00" stroke-width="1.5"/>
      <rect x="8" y="24" width="18" height="3" fill="#2c3e50"/>
    </g>

    <g id="item-sword" viewBox="0 0 32 32">
      <line x1="8" y1="24" x2="24" y2="8" stroke="#bdc3c7" stroke-width="3" stroke-linecap="round"/>
      <polygon points="22,6 26,6 26,10" fill="#ecf0f1"/>
      <line x1="8" y1="20" x2="12" y2="24" stroke="#d4ac0d" stroke-width="2.5"/>
      <line x1="6" y1="26" x2="10" y2="22" stroke="#784212" stroke-width="3"/>
    </g>

    <g id="item-crossbow" viewBox="0 0 32 32">
      <path d="M6 14 C12 6 20 6 26 14" stroke="#784212" stroke-width="3" fill="none"/>
      <line x1="16" y1="10" x2="16" y2="26" stroke="#95a5a6" stroke-width="2.5"/>
      <polygon points="16,8 13,12 19,12" fill="#2c3e50"/>
    </g>

    <g id="item-torch" viewBox="0 0 32 32">
      <polygon points="12,14 20,14 17,28 15,28" fill="#784212"/>
      <path d="M16 4 C12 8 12 13 16 14 C20 13 20 8 16 4 Z" fill="#e74c3c"/>
      <path d="M16 7 C14 10 14 13 16 14 C18 13 18 10 16 7 Z" fill="#f39c12"/>
      <circle cx="16" cy="11" r="1.5" fill="#fef9e7"/>
    </g>

    <g id="item-hammer" viewBox="0 0 32 32">
      <rect x="8" y="8" width="16" height="8" rx="2" fill="#7f8c8d" stroke="#34495e" stroke-width="1.2"/>
      <line x1="16" y1="16" x2="16" y2="28" stroke="#af601a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g id="item-tea" viewBox="0 0 32 32">
      <path d="M8 12 L24 12 L22 24 C22 26 10 26 10 24 Z" fill="#16a085" stroke="#0e6251" stroke-width="1.2"/>
      <path d="M24 14 Q28 17 24 20" stroke="#0e6251" stroke-width="2" fill="none"/>
      <path d="M12 8 Q14 5 13 3" stroke="#bdc3c7" stroke-width="1.2" fill="none"/>
      <path d="M16 8 Q18 5 17 3" stroke="#bdc3c7" stroke-width="1.2" fill="none"/>
    </g>

    <g id="item-coins" viewBox="0 0 32 32">
      <circle cx="14" cy="18" r="8" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
      <circle cx="14" cy="18" r="5" fill="#f7dc6f"/>
      <circle cx="20" cy="13" r="8" fill="#f39c12" stroke="#b7950b" stroke-width="1.5"/>
      <circle cx="20" cy="13" r="5" fill="#f8c471"/>
      <text x="20" y="16" font-size="8" font-weight="bold" text-anchor="middle" fill="#784212">$</text>
    </g>

    <g id="item-bag" viewBox="0 0 32 32">
      <path d="M8 14 C8 10 12 10 16 10 C20 10 24 10 24 14 L26 26 C26 28 6 28 6 26 Z" fill="#935116" stroke="#5b2c6f" stroke-width="1.2"/>
      <rect x="12" y="8" width="8" height="4" rx="2" fill="#d35400"/>
      <line x1="6" y1="16" x2="26" y2="16" stroke="#5b2c6f" stroke-width="1.5"/>
    </g>

    <!-- DICE FACES (0, 1, 2, 3) -->
    <g id="dice-0" viewBox="0 0 32 32">
      <rect x="2" y="2" width="28" height="28" rx="6" fill="#fbfcfc" stroke="#7f8c8d" stroke-width="2"/>
      <text x="16" y="22" font-size="16" font-weight="900" text-anchor="middle" fill="#7f8c8d">0</text>
    </g>
    <g id="dice-1" viewBox="0 0 32 32">
      <rect x="2" y="2" width="28" height="28" rx="6" fill="#fbfcfc" stroke="#c0392b" stroke-width="2"/>
      <circle cx="16" cy="16" r="3.5" fill="#c0392b"/>
    </g>
    <g id="dice-2" viewBox="0 0 32 32">
      <rect x="2" y="2" width="28" height="28" rx="6" fill="#fbfcfc" stroke="#2980b9" stroke-width="2"/>
      <circle cx="10" cy="10" r="3" fill="#2980b9"/>
      <circle cx="22" cy="22" r="3" fill="#2980b9"/>
    </g>
    <g id="dice-3" viewBox="0 0 32 32">
      <rect x="2" y="2" width="28" height="28" rx="6" fill="#fbfcfc" stroke="#d35400" stroke-width="2"/>
      <circle cx="9" cy="9" r="3" fill="#d35400"/>
      <circle cx="16" cy="16" r="3" fill="#d35400"/>
      <circle cx="23" cy="23" r="3" fill="#d35400"/>
    </g>
  </defs>
</svg>
